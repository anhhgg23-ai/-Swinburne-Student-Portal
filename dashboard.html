<script>

document.getElementById('gpa').textContent =
CALCULATED_GPA.toFixed(2);

document.getElementById('credits').textContent =
TOTAL_CREDITS + ' / ' + S.totalCredits + ' CP';

S.progress + '%';

S.name;

document.getElementById('studentId').textContent =
S.id;

document.getElementById('classification').textContent =
S.classification;


const latest =
R.slice(-3).reverse();


document.getElementById('latestResults').innerHTML =
latest.map(row => `
<p>
<strong>${row[0]}</strong>
 · ${row[1]}
 · ${row[2]}
 · ${row[3]}
</p>
`).join('');

</script>
