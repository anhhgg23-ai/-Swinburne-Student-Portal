<article>

  <h1>
    Graduation
  </h1>


  <div class="panel">

    <h2 id="graduationStatus">
      —
    </h2>


    <div class="bar">

      <i id="progressBar"></i>

    </div>


    <p>
      <strong>Graduation Status:</strong>
      <span id="status">—</span>
    </p>


    <p>
      <strong>Award:</strong>
      <span id="award">—</span>
    </p>


    <p>
      <strong>Classification:</strong>
      <span id="classification">—</span>
    </p>


    <p>
      <strong>GPA:</strong>
      <span id="gpa">—</span>
      / 4.00
    </p>


    <p>
      <strong>Credits Completed:</strong>
      <span id="credits">—</span>
    </p>


    <p>
      <strong>Units Completed:</strong>
      <span id="units">—</span>
    </p>


    <p>
      <strong>Program Progress:</strong>
      <span id="progress">—</span>
    </p>

  </div>

</article>



<script src="data.js"></script>


<script>

document.getElementById(
  'graduationStatus'
).textContent =
  S.progress + '% complete';


document.getElementById(
  'progressBar'
).style.width =
  S.progress + '%';


document.getElementById(
  'status'
).textContent =
  S.graduationStatus;


document.getElementById(
  'award'
).textContent =
  S.award;


document.getElementById(
  'classification'
).textContent =
  S.classification;


document.getElementById(
  'gpa'
).textContent =
  CALCULATED_GPA.toFixed(2);


document.getElementById(
  'credits'
).textContent =
  TOTAL_CREDITS +
  ' / ' +
  S.totalCredits +
  ' CP';


document.getElementById(
  'units'
).textContent =
  R.length +
  ' / ' +
  R.length;


document.getElementById(
  'progress'
).textContent =
  S.progress + '%';

</script>


<script src="app.js"></script>

</body>

</html>
